# CPU frames in a small MP4 container. Frame packets use anvil-compress (zlib).
# Sample encryption uses anvil-cipher (AES-128-CTR). Plane conversion uses
# anvil-gpu on the CPU. No hardware decoder.
# Caller: anvil-browser. anvil-dom only records the video URL and does not
# link this crate. anvil-raster does not link this crate either.

[package]
name = "anvil-video"
version = "0.4.0"
edition = "2024"
authors = ["Buntos <324143321+buntatoes@users.noreply.github.com>"]
license = "MPL-2.0"
description = "CPU video frames in a small MP4 container, plus AES-128-CTR samples. No hardware decoder."
repository = "https://github.com/buntatoes/anvil-video"
homepage = "https://github.com/buntatoes/anvil-video"
readme = "README.md"
keywords = ["video", "mp4", "aes"]
categories = ["multimedia::video", "rendering"]
publish = false

[dependencies]
anvil-cipher = { path = "../anvil-cipher" }
anvil-compress = { path = "../anvil-compress" }
anvil-gpu = { path = "../anvil-gpu" }
