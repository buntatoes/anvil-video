[package]
name = "flux-video"
version = "0.4.0"
edition = "2024"
authors = ["Buntos <324143321+buntatoes@users.noreply.github.com>"]
license = "MPL-2.0"
description = "CPU video frames in a small MP4 container, plus AES-128-CTR samples. No hardware decoder."
repository = "https://github.com/buntatoes/flux-video"
homepage = "https://github.com/buntatoes/flux-video"
readme = "README.md"
keywords = ["video", "mp4", "aes"]
categories = ["multimedia::video", "rendering"]

[dependencies]
flux-cipher = { path = "../flux-cipher" }
flux-compress = { path = "../flux-compress" }
flux-gpu = { path = "../flux-gpu" }
