# CPU video/audio codecs (AVID + 8x8 DCT/IDCT ADCT video, PCM/ADPCM/FLAC/MDCT audio),
# ISOBMFF (.mp4 / fMP4) and WebM/EBML containers, AES-128-CTR sample encryption,
# and Opus/VP8/VP9/AV1 header parsers and transform/filter helpers.
# Frame packets use anvil-compress (zlib). Plane conversion and present go
# through anvil-gpu's compositor or tile device.
# Callers: anvil-browser and anvil-script (in anvil-engine). anvil-dom only
# records the video URL and does not link this crate.

[package]
name = "anvil-video"
version = "0.9.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["Buntato"]
license = "LicenseRef-PolyForm-Noncommercial-1.0.0-OR-Commercial"
description = "AVID/ADCT video, PCM/ADPCM/FLAC/MDCT audio, MP4/fMP4/WebM containers, and Opus/VP8/VP9/AV1 header and framing helpers."
repository = "https://github.com/buntatoes/anvil-video"
homepage = "https://github.com/buntatoes/anvil-video"
readme = "README.md"
keywords = ["video", "mp4", "aes"]
categories = ["multimedia::video", "rendering"]
publish = false

[dependencies]
anvil-cipher = { path = "../anvil-cipher" }
anvil-compress = { path = "../anvil-compress" }
anvil-gpu = { path = "../anvil-gpu" }
