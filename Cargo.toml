[package]
name = "flux-video"
version = "0.3.0"
edition = "2024"
authors = ["Buntos <324143321+buntatoes@users.noreply.github.com>"]
license = "MPL-2.0"
description = "GPU-accelerated NV12/BT.709 video encoder and decoder, ISOBMFF/MP4 container muxer/demuxer, ISO/IEC 23001-7 CENC encryption, and W3C EME/CDM session engine."
repository = "https://github.com/buntatoes/flux-video"
homepage = "https://github.com/buntatoes/flux-video"
readme = "README.md"
keywords = ["video", "codec", "gpu", "nv12", "mp4"]
categories = ["multimedia::video", "rendering"]

[dependencies]
flux-compress = { path = "../flux-compress" }
flux-gpu = { path = "../flux-gpu" }
