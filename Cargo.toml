# CPU frames in a small MP4 container. Frame packets use anvil-compress (zlib).
# Plane conversion and present go through anvil-gpu's tile device when the
# hardware flag is set. The AVID bytes are still zlib packets. No H.264 device.
# Caller: anvil-browser. anvil-dom (in anvil-engine) only records the video
# URL and does not link this crate. anvil-raster (also in anvil-engine) does not
# link this crate either.

[package]
name = "anvil-video"
version = "0.9.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["Buntato"]
license = "LicenseRef-PolyForm-Noncommercial-1.0.0-OR-Commercial"
description = "AVID frames in a small MP4 container. Plane conversion uses the anvil-gpu software device."
repository = "https://github.com/buntatoes/anvil-video"
homepage = "https://github.com/buntatoes/anvil-video"
readme = "README.md"
keywords = ["video", "mp4", "aes"]
categories = ["multimedia::video", "rendering"]
publish = false

[dependencies]
anvil-cipher = { path = "../anvil-cipher" }
anvil-compress = { path = "../anvil-compress" }
anvil-gpu = { path = "../anvil-gpu" }
