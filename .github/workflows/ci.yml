# Build, vet, and test anvil-video on Linux and Windows using Go.
# Zero external dependencies in go.mod.

name: ci

on:
  push:
    branches: [main, testing]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.22"
          cache: false

      - name: Check for outside Go modules
        run: |
          if grep -E 'require|replace' go.mod; then
            echo "go.mod lists external dependencies."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: Build CLI and worker binary
        run: go build ./cmd/anvil-video
