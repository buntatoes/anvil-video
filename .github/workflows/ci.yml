# Build, test, lint, and release-build anvil-video on Linux and Windows.
#
# Path dependencies point at sibling directories, so the job checks this
# repository out into its own folder and clones each sibling next to it.
# Every cargo command runs with --offline: the project uses no crates from
# outside the anvil repositories, and a registry download is a failure.

name: ci

on:
  push:
    branches: [main, testing]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_OFFLINE: "true"

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: anvil-video
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          path: anvil-video

      - name: Check out sibling repositories
        working-directory: .
        run: |
          for repo in anvil-cipher anvil-compress anvil-gpu; do
            git clone --depth 1 -b "${{ github.ref_name }}" "https://github.com/${{ github.repository_owner }}/$repo.git" "$repo" 2>/dev/null || git clone --depth 1 "https://github.com/${{ github.repository_owner }}/$repo.git" "$repo"
          done

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Check for outside crates
        run: |
          # Resolve offline first: most anvil repositories do not track
          # Cargo.lock, so a fresh checkout has none until cargo writes it.
          # Path dependencies have no source line in Cargo.lock. Registry and
          # git dependencies do.
          cargo metadata --offline --format-version 1 > /dev/null
          if grep -n '^source = ' Cargo.lock; then
            echo "Cargo.lock lists a crate from outside the anvil repositories."
            exit 1
          fi

      - name: Build
        run: cargo build --offline --workspace --all-targets

      - name: Test
        run: cargo test --offline --workspace

      - name: Clippy
        run: cargo clippy --offline --workspace --all-targets

      - name: Release build
        run: cargo build --offline --workspace --release
